# Blueprint de Render — https://render.com/docs/blueprint-spec
#
# Ningún valor real de configuración vive aquí: todas las variables sensibles
# van con `sync: false`, lo que hace que Render las pida en el dashboard la
# primera vez y no las guarde nunca en el repositorio.
services:
  - type: web
    name: estudio-lumen
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Fija la versión de Node con la que se probó el proyecto. No es un
      # secreto, así que va con valor literal.
      - key: NODE_VERSION
        value: "24"

      # Detrás del proxy de Render esto DEBE valer 1, o el rate limiting
      # tratará a todos los visitantes como una sola IP.
      - key: TRUST_PROXY
        sync: false

      # SMTP — se rellenan a mano en el dashboard.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false

      # Ruta del archivo SQLite dentro del proyecto.
      - key: DB_PATH
        sync: false
